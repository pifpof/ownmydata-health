appId: com.parallel79.ownmydata
productName: ownmydata
copyright: "Copyright © 2026 1617289 B.C. Ltd."
directories:
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: ../LICENSE
    to: LICENSE
  - from: src/renderer/src/assets/fonts/LICENSE-DejaVu.txt
    to: LICENSE-DejaVu.txt
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.medical
  identity: "-"
  hardenedRuntime: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
artifactName: ${productName}-${version}-${arch}.${ext}
