name: Something didn't work
description: A skill did something wrong, asked you something it shouldn't, or misread a document.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Use fictional data only.** Do not paste real lab results, visit notes, names, dates of birth or any other real health information, including your own. Recreate the problem with made-up values (see `fixtures/` for examples).
  - type: checkboxes
    id: fictional
    attributes:
      label: Data check
      options:
        - label: Everything in this issue is fictional. It contains no real person's health information.
          required: true
  - type: input
    id: version
    attributes:
      label: ownmydata version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where were you running it?
      options:
        - Claude Code
        - Claude desktop (Project)
        - Other
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Which skill?
      placeholder: "capture, start, save, intake, health-check, setup-health-vault, recenter"
  - type: textarea
    id: what
    attributes:
      label: What you did
      description: The command or sentence, and the (fictional) document if there was one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste Claude's reply or the record it wrote, with any real-looking details replaced.
    validations:
      required: true
